name: 🕌 Build Quran App APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fix Kotlin version
        run: |
          sed -i 's/kotlinVersion = "1.9.23"/kotlinVersion = "1.8.22"/' android/build.gradle

      - name: Download Gradle wrapper
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.6/bin/gradle wrapper
          chmod +x gradlew

      - name: Generate keystore
        run: |
          cd android/app
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug,O=Android,C=US"

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - uses: actions/upload-artifact@v4
        with:
          name: quran-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
